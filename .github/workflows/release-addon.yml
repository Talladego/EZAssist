# Build an installable EZAssist zip (runtime addon files only) and publish it.
# - A non-empty CHANGELOG.md section for the mod version is required before pack.
# - Pull requests pack the zip and upload a workflow artifact.
# - Push to master/main, or a manual run, publishes vX.Y.Z (marked Latest) with
#   EZAssist-<version>.zip and EZAssist.zip, and refreshes the moving "latest"
#   tag as a normal release (not a prerelease) when that zip is new.
# - Tag v* publishes that version when the tag matches EZAssist.mod, and
#   refreshes the moving "latest" tag the same way.
# Version tags older than the newest 10 are deleted.
# Return of Reckoning upload runs when ROR_TOKEN is set. A 404 on the public
# release URL means that version is new and should be posted; the addon page
# itself stays 404 until the first release is approved, so it is not pre-checked.
name: Release addon zip

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(python3 tools/changelog-section.py \
            --section-out dist/ror-changelog.md \
            --notes-out dist/release-notes.md)
          {
            echo "version=${version}"
            echo "changelog_path=${GITHUB_WORKSPACE}/dist/ror-changelog.md"
            echo "release_notes_path=${GITHUB_WORKSPACE}/dist/release-notes.md"
          } >> "$GITHUB_OUTPUT"

      - name: Lua 5.1 syntax check
        shell: bash
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          mod_ver=$(sed -nE 's/.*<UiMod[^>]*version="([^"]+)".*/\1/p' EZAssist.mod | head -n 1)
          if [[ "$mod_ver" != "$VERSION" ]]; then
            echo "EZAssist.mod version ${mod_ver} does not match CHANGELOG ${VERSION}" >&2
            exit 1
          fi
          lua_ver=$(sed -nE 's/^EZAssist\.VERSION = "([^"]*)".*/\1/p' EZAssist.lua)
          if [[ "$lua_ver" != "$VERSION" ]]; then
            echo "EZAssist.lua EZAssist.VERSION ${lua_ver:-<missing>} does not match ${VERSION}" >&2
            exit 1
          fi
          cfg_ver=$(sed -nE 's/^[[:space:]]*local VERSION = \(EZAssist and EZAssist\.VERSION\) or "([^"]*)".*/\1/p' EZAssist_Config.lua)
          if [[ -n "$cfg_ver" && "$cfg_ver" != "$VERSION" ]]; then
            echo "EZAssist_Config.lua VERSION fallback ${cfg_ver} does not match ${VERSION}" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match addon version v${VERSION}" >&2
            exit 1
          fi
          python3 tools/ror-response.py self-test
          tmp=$(mktemp -d)
          files=(
            EZAssist.lua
            EZAssist_Controller.lua
            EZAssist_Config.lua
            EZAssist_GroupStats.lua
            EZAssist_ScenarioStats.lua
          )
          for f in "${files[@]}"; do
            # WAR wstring literals (L"...") are not valid Lua 5.1. Check a rewritten copy.
            sed -E 's/L"([^"]*)"/"\1"/g' "$f" > "$tmp/$f"
            luac5.1 -p "$tmp/$f"
          done
          lua5.1 tools/test-group-stats-wrap.lua
          lua5.1 tools/test-macro-slot.lua

      - name: Addon zip verifier self-test
        shell: bash
        run: python3 tools/verify-addon-zip.py self-test

      - name: Pack addon zip
        id: pack
        shell: pwsh
        run: ./tools/pack.ps1 -OutDir dist

      - name: Write unversioned addon zip
        shell: bash
        env:
          ZIP: ${{ steps.pack.outputs.zip_path }}
          VERSION: ${{ steps.pack.outputs.version }}
          EXPECTED_VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Packed version ${VERSION} does not match EZAssist.mod / CHANGELOG ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          cp -f "$ZIP" dist/EZAssist.zip
          test -s dist/EZAssist.zip

      - name: Verify packed zips and source archive
        shell: bash
        env:
          ZIP: ${{ steps.pack.outputs.zip_path }}
        run: |
          set -euo pipefail
          python3 tools/verify-addon-zip.py "$ZIP"
          python3 tools/verify-addon-zip.py dist/EZAssist.zip
          # CI guard only. Do not upload source-archive.zip.
          git archive --format=zip --prefix=EZAssist/ -o dist/source-archive.zip HEAD
          python3 tools/verify-addon-zip.py dist/source-archive.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZAssist-addon
          path: |
            dist/EZAssist-*.zip
            dist/EZAssist.zip
          if-no-files-found: error

      - name: Upload new release to the addon site
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ROR_TOKEN: ${{ secrets.ROR_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog_path }}
        run: bash tools/publish-ror.sh

      - name: Publish versioned release and keep 10 version tags
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION:-}" || -z "${ZIP:-}" || ! -f dist/EZAssist.zip ]]; then
            echo "Pack step did not output version, zip_path, and dist/EZAssist.zip" >&2
            exit 1
          fi
          tag="v${VERSION}"
          zip_name="EZAssist-${VERSION}.zip"
          plain_name="EZAssist.zip"
          version_notes=$(cat "$RELEASE_NOTES")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" dist/EZAssist.zip --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "EZAssist ${VERSION}" \
              --latest \
              --notes "$version_notes"
          else
            gh release create "$tag" "$ZIP" dist/EZAssist.zip \
              --target "$GITHUB_SHA" \
              --title "EZAssist ${VERSION}" \
              --latest \
              --notes "$version_notes"
          fi

          skip_latest=0
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            existing=""
            if existing=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null); then
              if printf '%s\n' "$existing" | grep -Fxq "$zip_name" \
                && printf '%s\n' "$existing" | grep -Fxq "$plain_name"; then
                echo "latest already has ${zip_name} and ${plain_name}; skipping recreate"
                skip_latest=1
              fi
            fi
          fi
          if [[ "$skip_latest" -eq 0 ]]; then
            gh release delete latest --yes --cleanup-tag || true
            git push origin :refs/tags/latest 2>/dev/null || true
            gh release create latest "$ZIP" dist/EZAssist.zip \
              --verify-tag=false \
              --target "$GITHUB_SHA" \
              --title "EZAssist Latest (${VERSION})" \
              --notes "$version_notes" \
              --latest=false
          fi

          gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | reverse | .[10:] | .[].tagName' \
            | while IFS= read -r old; do
                [ -n "$old" ] || continue
                if [[ "$old" == "$tag" ]]; then
                  continue
                fi
                gh release delete "$old" --yes --cleanup-tag
              done

      - name: Publish versioned release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION:-}" || -z "${ZIP:-}" || ! -f dist/EZAssist.zip ]]; then
            echo "Pack step did not output version, zip_path, and dist/EZAssist.zip" >&2
            exit 1
          fi
          ref_ver="${GITHUB_REF_NAME#v}"
          if [[ "$ref_ver" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match EZAssist.mod version ${VERSION} (expected v${VERSION})" >&2
            exit 1
          fi
          tag="v${VERSION}"
          zip_name="EZAssist-${VERSION}.zip"
          plain_name="EZAssist.zip"
          version_notes=$(cat "$RELEASE_NOTES")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" dist/EZAssist.zip --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "EZAssist ${VERSION}" \
              --latest \
              --notes "$version_notes"
          else
            gh release create "$tag" "$ZIP" dist/EZAssist.zip \
              --target "$GITHUB_SHA" \
              --title "EZAssist ${VERSION}" \
              --latest \
              --notes "$version_notes"
          fi

          skip_latest=0
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            existing=""
            if existing=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null); then
              if printf '%s\n' "$existing" | grep -Fxq "$zip_name" \
                && printf '%s\n' "$existing" | grep -Fxq "$plain_name"; then
                echo "latest already has ${zip_name} and ${plain_name}; skipping recreate"
                skip_latest=1
              fi
            fi
          fi
          if [[ "$skip_latest" -eq 0 ]]; then
            gh release delete latest --yes --cleanup-tag || true
            git push origin :refs/tags/latest 2>/dev/null || true
            gh release create latest "$ZIP" dist/EZAssist.zip \
              --verify-tag=false \
              --target "$GITHUB_SHA" \
              --title "EZAssist Latest (${VERSION})" \
              --notes "$version_notes" \
              --latest=false
          fi
